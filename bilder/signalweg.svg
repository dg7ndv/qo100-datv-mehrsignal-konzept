<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 930" width="100%" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="Signalweg vom I/Q-Strom des SDR bis zum fertigen Transportstrom, Tesla und Raspi, mit Problemstellen">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#46556a"/></marker></defs>
<rect x="0" y="0" width="1500" height="930" rx="12" fill="#f7f9fb" stroke="#d3d9e0" stroke-width="1.5"/>
<text x="20" y="30" font-size="18" font-weight="bold" fill="#1b1f24">Signalweg: vom I/Q-Strom des SDR bis zum Transportstrom (rote Zahlen = Problemstellen)</text>
<text x="20" y="62" font-size="15" font-weight="bold" fill="#c05a00">TESLA – Single_fenster_decoder (SDRplay RSP2, ganzes Band)</text>
<rect x="20" y="75" width="170" height="100" rx="10" fill="#fff7e0" stroke="#c9a227" stroke-width="2"/>
<text x="105.0" y="99" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="middle">LNB + RSP2</text>
<text x="105.0" y="119" font-size="11" fill="#5b6573" text-anchor="middle">LNB-LO 9540,12 MHz</text>
<text x="105.0" y="135" font-size="11" fill="#5b6573" text-anchor="middle">Band 10491–10499 MHz</text>
<text x="105.0" y="151" font-size="11" fill="#5b6573" text-anchor="middle">10 MS/s, 16 Bit I/Q</text>
<rect x="230" y="75" width="150" height="100" rx="10" fill="#eaf1f8" stroke="#46556a" stroke-width="2"/>
<text x="305.0" y="99" font-size="14" font-weight="bold" fill="#1f5fa8" text-anchor="middle">rx_sdr</text>
<text x="305.0" y="119" font-size="11" fill="#5b6573" text-anchor="middle">Pipe mit I/Q-Werten</text>
<text x="305.0" y="135" font-size="11" fill="#5b6573" text-anchor="middle">komplex, 320 Mbit/s</text>
<rect x="660" y="75" width="230" height="100" rx="10" fill="#2a7be4" stroke="#222" stroke-width="2"/>
<text x="775.0" y="99" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">mixdec (C, OpenMP)</text>
<text x="775.0" y="119" font-size="11" fill="#eaf2ff" text-anchor="middle">1) Mischen auf +300 kHz</text>
<text x="775.0" y="135" font-size="11" fill="#eaf2ff" text-anchor="middle">2) FIR-Tiefpass 64 Taps, 1,2 MHz</text>
<text x="775.0" y="151" font-size="11" fill="#eaf2ff" text-anchor="middle">3) Dezimieren /4 → 2,5 MS/s</text>
<rect x="930" y="75" width="150" height="100" rx="10" fill="#fff" stroke="#46556a" stroke-width="2"/>
<text x="1005.0" y="99" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="middle">FIFO je Signal</text>
<text x="1005.0" y="119" font-size="11" fill="#5b6573" text-anchor="middle">1 MiB Pipe</text>
<text x="1005.0" y="135" font-size="11" fill="#5b6573" text-anchor="middle">nicht blockierend</text>
<text x="1005.0" y="151" font-size="11" fill="#5b6573" text-anchor="middle">40 Mbit/s je Signal</text>
<rect x="1120" y="75" width="170" height="100" rx="10" fill="#2f9e5b" stroke="#222" stroke-width="2"/>
<text x="1205.0" y="99" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">datvrx (je Signal)</text>
<text x="1205.0" y="119" font-size="11" fill="#eafff0" text-anchor="middle">Träger + Symbolrate suchen</text>
<text x="1205.0" y="135" font-size="11" fill="#eafff0" text-anchor="middle">Demodulation, LDPC/BCH</text>
<rect x="1330" y="75" width="150" height="100" rx="10" fill="#dfe6ee" stroke="#46556a" stroke-width="2"/>
<text x="1405.0" y="99" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="middle">Relay</text>
<text x="1405.0" y="119" font-size="11" fill="#5b6573" text-anchor="middle">MPEG-TS → UDP</text>
<text x="1405.0" y="135" font-size="11" fill="#5b6573" text-anchor="middle">230.0.0.50+x :1234</text>
<text x="1405.0" y="151" font-size="11" fill="#5b6573" text-anchor="middle">und HTTP :8570</text>
<line x1="190" y1="125" x2="228" y2="125" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="380" y1="125" x2="658" y2="125" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="519.0" y="112" font-size="11" fill="#1f5fa8" text-anchor="middle" font-weight="bold">alle Signale gemischt: 10 MS/s I/Q</text>
<line x1="890" y1="125" x2="928" y2="125" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="1080" y1="125" x2="1118" y2="125" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="1290" y1="125" x2="1328" y2="125" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="420" y="215" width="200" height="90" rx="10" fill="#eaf1f8" stroke="#46556a" stroke-width="2"/>
<text x="520.0" y="239" font-size="14" font-weight="bold" fill="#1f5fa8" text-anchor="middle">Python: Spektrum</text>
<text x="520.0" y="259" font-size="11" fill="#5b6573" text-anchor="middle">FFT 8192 Punkte, Grundlinie, 3 dB</text>
<text x="520.0" y="275" font-size="11" fill="#5b6573" text-anchor="middle">≥ 0,10 MHz breit → Mitte f, Breite w</text>
<line x1="305" y1="177" x2="305" y2="260" stroke="#46556a" stroke-width="1.5" stroke-dasharray="6,4"/><line x1="305" y1="260" x2="418" y2="260" stroke="#46556a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah)"/>
<text x="312" y="205" font-size="11" fill="#5b6573">Kopie des Stroms</text>
<line x1="620" y1="260" x2="775" y2="260" stroke="#46556a" stroke-width="2.5"/><line x1="775" y1="260" x2="775" y2="177" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="700" y="250" font-size="11" fill="#1f5fa8" font-weight="bold" text-anchor="middle">f, w je Signal</text>
<text x="20" y="352" font-size="15" font-weight="bold" fill="#1a7f3c">RASPI – Multi_fenster_pi (RTL-Sticks, je Stick ein Fenster)</text>
<rect x="20" y="365" width="170" height="100" rx="10" fill="#fff7e0" stroke="#c9a227" stroke-width="2"/>
<text x="105.0" y="389" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="middle">LNB + RTL-Stick</text>
<text x="105.0" y="409" font-size="11" fill="#5b6573" text-anchor="middle">je Stick ein Fenster</text>
<text x="105.0" y="425" font-size="11" fill="#5b6573" text-anchor="middle">nur ±1,3 MHz nutzbar</text>
<rect x="230" y="365" width="150" height="100" rx="10" fill="#eaf1f8" stroke="#46556a" stroke-width="2"/>
<text x="305.0" y="389" font-size="14" font-weight="bold" fill="#1f5fa8" text-anchor="middle">rtl_sdr</text>
<text x="305.0" y="409" font-size="11" fill="#5b6573" text-anchor="middle">2,88 MS/s, 8 Bit I/Q</text>
<text x="305.0" y="425" font-size="11" fill="#5b6573" text-anchor="middle">46 Mbit/s je Stick</text>
<rect x="660" y="365" width="230" height="100" rx="10" fill="#2a7be4" stroke="#222" stroke-width="2"/>
<text x="775.0" y="389" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">mixsplit (C)</text>
<text x="775.0" y="409" font-size="11" fill="#eaf2ff" text-anchor="middle">Mischen auf +300 kHz je Signal</text>
<text x="775.0" y="425" font-size="11" fill="#eaf2ff" text-anchor="middle">keine Dezimation, kein FIR</text>
<text x="775.0" y="441" font-size="11" fill="#eaf2ff" text-anchor="middle">(Stick-Rate passt schon)</text>
<rect x="930" y="365" width="150" height="100" rx="10" fill="#fff" stroke="#46556a" stroke-width="2"/>
<text x="1005.0" y="389" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="middle">FIFO je Signal</text>
<text x="1005.0" y="409" font-size="11" fill="#5b6573" text-anchor="middle">1 MiB Pipe</text>
<text x="1005.0" y="425" font-size="11" fill="#5b6573" text-anchor="middle">nicht blockierend</text>
<rect x="1120" y="365" width="170" height="100" rx="10" fill="#2f9e5b" stroke="#222" stroke-width="2"/>
<text x="1205.0" y="389" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">datvrx (je Signal)</text>
<text x="1205.0" y="409" font-size="11" fill="#eafff0" text-anchor="middle">wie am Tesla</text>
<text x="1205.0" y="425" font-size="11" fill="#eafff0" text-anchor="middle">Symbolrate optional vorgegeben</text>
<rect x="1330" y="365" width="150" height="100" rx="10" fill="#dfe6ee" stroke="#46556a" stroke-width="2"/>
<text x="1405.0" y="389" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="middle">Relay</text>
<text x="1405.0" y="409" font-size="11" fill="#5b6573" text-anchor="middle">MPEG-TS → UDP</text>
<text x="1405.0" y="425" font-size="11" fill="#5b6573" text-anchor="middle">230.0.0.30+x :1234</text>
<text x="1405.0" y="441" font-size="11" fill="#5b6573" text-anchor="middle">und HTTP :8560</text>
<line x1="190" y1="415" x2="228" y2="415" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="380" y1="415" x2="658" y2="415" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="519.0" y="402" font-size="11" fill="#1f5fa8" text-anchor="middle" font-weight="bold">Fenster des Sticks: 2,88 MS/s I/Q</text>
<line x1="890" y1="415" x2="928" y2="415" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="1080" y1="415" x2="1118" y2="415" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="1290" y1="415" x2="1328" y2="415" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="420" y="495" width="260" height="90" rx="10" fill="#eaf1f8" stroke="#46556a" stroke-width="2"/>
<text x="550.0" y="519" font-size="14" font-weight="bold" fill="#1f5fa8" text-anchor="middle">BATC-Spektrum (Internet)</text>
<text x="550.0" y="539" font-size="11" fill="#5b6573" text-anchor="middle">wss://eshail.batc.org.uk/wb/fft</text>
<text x="550.0" y="555" font-size="11" fill="#5b6573" text-anchor="middle">Erkennung wie am Tesla → f, w</text>
<text x="550.0" y="571" font-size="11" fill="#5b6573" text-anchor="middle">→ Fenster/Stick planen</text>
<line x1="680" y1="540" x2="775" y2="540" stroke="#46556a" stroke-width="2.5"/><line x1="775" y1="540" x2="775" y2="467" stroke="#46556a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="728" y="530" font-size="11" fill="#1f5fa8" font-weight="bold" text-anchor="middle">f, w, Stick</text>
<circle cx="1066" cy="75" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="1066" y="80" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<circle cx="1276" cy="75" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="1276" y="80" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<circle cx="606" cy="215" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="606" y="220" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<circle cx="876" cy="75" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="876" y="80" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<circle cx="666" cy="495" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="666" y="500" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<circle cx="176" cy="365" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="176" y="370" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
<text x="20" y="625" font-size="14" font-weight="bold" fill="#1b1f24">Problemstellen</text>
<circle cx="36" cy="655" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="36" y="660" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="60" y="659" font-size="12.5" fill="#1b1f24">FIFO-Überlauf: Pipe zu klein (64 KiB = 13 ms) → datvrx hängt kurz, Daten gehen verloren, Lock reißt ab. Behoben: 1 MiB, nicht blockierend, Zähler „verworfen“.</text>
<circle cx="36" cy="695" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="36" y="700" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="60" y="699" font-size="12.5" fill="#1b1f24">datvrx-Suche ohne Lock kostet 2–3 Kerne (Rauschen!). Mit Lock nur ca. 0,24 Kern je Signal. Gegenmittel: Signale ohne Lock nach etwa 90 s aussortieren, Symbolrate aus der Breite schätzen (optional).</text>
<circle cx="36" cy="735" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="36" y="740" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="60" y="739" font-size="12.5" fill="#1b1f24">Erkennung nur grob: breite Signale am Bandende werden schlecht zentriert (Tesla 10498,64 statt 10499,00 MHz → kein Lock), Geister-Signale, Bake 10491,5 ausgenommen.</text>
<circle cx="36" cy="775" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="36" y="780" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="60" y="779" font-size="12.5" fill="#1b1f24">OpenMP-Busy-Wait: zeigte mixdec zunächst bis 1800 % CPU (Rechenthreads warten aktiv). Behoben durch passives Warten und 4 Threads.</text>
<circle cx="36" cy="815" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="36" y="820" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="60" y="819" font-size="12.5" fill="#1b1f24">Raspi braucht Internet (BATC-Feed); ohne Daten &#62; 20 s gibt es keine neuen Signale. Mitte/Breite kommen vom BATC, nicht von den Sticks.</text>
<circle cx="36" cy="855" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="36" y="860" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
<text x="60" y="859" font-size="12.5" fill="#1b1f24">RTL-Stick: nur 2,88 MS/s, ±1,3 MHz je Fenster → wenige Signale je Stick, mehrere Sticks nötig; Pi 5 bei vielen Suchen 90–98 % CPU, ca. 75 °C.</text>
<text x="20" y="915" font-size="12" fill="#5b6573">Beide Zweige enden gleich: datvrx liefert je Signal einen MPEG-TS-Strom (Lock, Es/N0, Symbolrate, Modulation), der als UDP-Multicast und per HTTP angeboten wird.</text>
</svg>